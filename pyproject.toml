[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-manager"
version = "0.1.0"
description = "Restore an Odoo backup zip (dump + filestore) from the command line"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Odoo",
]

[project.scripts]
odoo-manager = "odoo_manager.cli:main"

[tool.setuptools]
packages = ["odoo_manager"]
